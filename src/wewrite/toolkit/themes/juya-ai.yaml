# References: daily.juya.uk/issues/2026-10-24/ and mp.weixin.qq.com/s/fSkVo0b8poXVMKZWtjW50Q
name: "juya-ai"
description: "橘鸭 AI：随微信明暗切换的正文、暖色标题条、摘要卡片与术语标签"
aigc_footer: false
show_title: true
quote_as_card: true
article_style: "padding: 20px 14px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; word-break: break-word; overflow-wrap: break-word;"
colors:
  primary: "#c96442"
  secondary: "#b5532f"
  text: "inherit"
  text_light: "#6e6d6a"
  background: "#faf9f5"
  code_bg: "#f0efeb"
  code_color: "#5c1616"
  quote_border: "#d1cfcc"
  quote_bg: "#ffffff"
  border_radius: "12px"
  darkmode:
    background: "#191919"
    text: "#e7e4de"
    text_light: "#b6b1a7"
    reference_url: "#a7a39b"
    primary: "#efad7c"
    heading_bg: "#282623"
    quote_bg: "#282623"
    quote_border: "#443d32"
    code_bg: "#30281f"
    code_color: "#efad7c"
base_css: |
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: #1a1a1a;
    background: #faf9f5;
    max-width: 720px;
    margin: 0 auto;
    padding: 0;
    word-wrap: break-word;
  }
  h1 {
    color: inherit;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    margin: 20px 0 24px;
    padding: 2px 10px;
    letter-spacing: 0.06em;
    text-align: center;
  }
  h2 {
    color: inherit;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin: 30px 0 15px;
    padding: 12px 18px;
    background: rgba(145, 115, 76, 0.12);
    border: none;
    border-radius: 12px;
    letter-spacing: 0.04em;
  }
  h3 {
    color: inherit;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    margin: 22px 0 10px;
    padding: 0;
    border: none;
  }
  h4 { color: inherit; font-size: 16px; font-weight: 600; line-height: 1.6; margin: 22px 0 12px; }
  blockquote p { color: inherit; background: transparent; isolation: isolate; margin: 0; padding: 12px 16px; line-height: 1.8; }
  p.gallery-caption { margin: 0 0 6px; }
  p.gallery-image-label { margin: 4px 0 0; overflow-wrap: anywhere; }
  p.single-image-caption { width: fit-content; max-width: 100%; margin: 0 auto 14px; overflow-wrap: anywhere; }
  p.media-caption { font-size: 13px; line-height: 1.6; color: inherit; opacity: 0.78; margin: 0 0 14px; padding: 0; text-align: left; }
  img.media-wide { width: 100%; }
  p.article-overview-title { margin: 10px 0 5px; padding: 0; }
  section.article-overview-item { font-size: 15px; line-height: 1.65; margin-bottom: 4px; }
  section.article-reference-block { margin-top: 24px; }
  p.article-reference-title {
    font-size: 13px;
    line-height: 1.6;
    color: inherit;
    opacity: 0.78;
    font-weight: 700;
    margin: 0 0 6px;
    padding: 0;
    text-align: left;
    text-align-last: left;
    letter-spacing: normal;
  }
  ul.article-references { list-style: disc; color: #777; margin: 0; padding-left: 18px; }
  ul.article-references li {
    font-size: 12px;
    line-height: 1.6;
    color: inherit;
    margin: 0 0 7px;
    text-align: left;
    text-align-last: left;
    letter-spacing: normal;
    overflow-wrap: anywhere;
  }
  span.reference-name { color: #5f5b55; font-weight: 600; }
  span.reference-url { display: block; color: #6f6b65; font-weight: 400; }
  p { font-size: 15px; line-height: 1.8; color: inherit; margin: 8px 0; padding: 0; letter-spacing: 0.04em; text-align: left; }
  strong { color: inherit; font-weight: 700; }
  em { color: inherit; font-style: normal; }
  a { color: inherit; text-decoration: underline; word-break: break-all; }
  blockquote {
    background: rgba(132, 112, 80, 0.09);
    border: 1px solid rgba(132, 112, 80, 0.3);
    border-radius: 24px;
    box-sizing: border-box;
    overflow: hidden;
    padding: 0;
    margin: 12px 0;
    color: inherit;
  }
  h2 code { font-size: 13px; }
  li code { font-size: 13px; }
  pre code { background: transparent; border: none; padding: 0; color: inherit; }
  code.short-token { white-space: nowrap; }
  code {
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 14px;
    color: inherit;
    background: rgba(161, 98, 62, 0.13);
    border: 1px solid rgba(132, 112, 80, 0.3);
    padding: 2px 4px;
    margin: 0 2px;
    border-radius: 8px;
    letter-spacing: 0;
  }
  pre { background: rgba(132, 112, 80, 0.09); border: 1px solid rgba(132, 112, 80, 0.3); border-radius: 12px; padding: 12px 20px; margin: 20px 0; overflow-x: auto; line-height: 1.75; }
  ul { padding-left: 22px; margin: 16px 0; }
  ol { padding-left: 22px; margin: 16px 0; }
  li { font-size: 15px; line-height: 1.8; color: inherit; margin: 5px 0; }
  table { width: 100%; border-collapse: collapse; margin: 22px 0; font-size: 14px; }
  th { background: rgba(145, 115, 76, 0.12); color: inherit; border: 1px solid rgba(132, 112, 80, 0.3); font-weight: 700; text-align: left; padding: 10px 12px; }
  td { border: 1px solid rgba(132, 112, 80, 0.3); color: inherit; text-align: left; padding: 10px 12px; }
  img { display: block; max-width: 100%; height: auto; margin: 12px auto 6px; border-radius: 12px; }
  hr { height: 0; border: none; border-top: 1px solid rgba(132, 112, 80, 0.3); margin: 28px 0; }
